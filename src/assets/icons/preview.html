<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>2.5D 图标预览</title>
<style>
  body{margin:0;background:#f5f5f7;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;
       display:flex;gap:16px;padding:48px;justify-content:center;align-items:flex-start}
  .card{background:#fff;border-radius:16px;padding:22px 18px;width:120px;text-align:center;
        box-shadow:0 4px 18px rgba(0,0,0,.06)}
  .card img{width:52px;height:52px;display:block;margin:0 auto}
  .card span{display:block;margin-top:12px;font-size:13px;color:#333;font-weight:500}
  .tip{position:fixed;top:16px;left:50%;transform:translateX(-50%);
       font-size:12px;color:#888;background:#fff;padding:6px 14px;border-radius:20px;
       box-shadow:0 2px 8px rgba(0,0,0,.08)}
</style>
</head>
<body>
  <div class="tip">模拟精选页白卡里的样子 · 坤哥这边找的对比</div>
  <div class="card"><img src="flame-3d.svg"><span>热购榜单</span></div>
  <div class="card"><img src="sparkles-3d.svg"><span>近期上新</span></div>
  <div class="card"><img src="award-3d.svg"><span>玩转积分</span></div>
</body>
</html>
